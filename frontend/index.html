<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grocery Availability</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Grocery<span>Availability</span></a>
    <nav>
      <a href="/">Browse</a>
      <a href="/wishlist.html" id="wishlistLink" hidden>Wishlist</a>
      <a href="/shop.html" id="shopLink" hidden>My Shop</a>
      <a href="/login.html" id="loginLink">Sign in</a>
      <button class="btn btn-outline btn-small" id="logoutBtn" hidden>Sign out</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">LIVE AVAILABILITY</p>
      <h1>Check what is in stock,<br />near you, right now.</h1>
      <p class="hero-text">
        Browse shops, compare prices and stock levels, and keep a wishlist of
        the groceries and household items you want to buy.
      </p>
    </section>

    <section class="filters panel">
      <div class="filter-row">
        <label class="field field-grow">
          <span>Search products</span>
          <input id="searchInput" type="search" placeholder="Rice, milk, soap…" autocomplete="off" />
        </label>
        <label class="field">
          <span>Product type</span>
          <select id="typeFilter">
            <option value="">All types</option>
            <option value="grocery">Grocery</option>
            <option value="household">Household</option>
          </select>
        </label>
        <label class="field">
          <span>Category</span>
          <select id="categoryFilter">
            <option value="">All categories</option>
          </select>
        </label>
        <label class="field">
          <span>Shop</span>
          <select id="shopFilter">
            <option value="">All shops</option>
          </select>
        </label>
      </div>
      <div class="filter-summary">
        <p id="resultCount">Loading products…</p>
        <button class="btn btn-quiet btn-small" id="resetBtn" type="button">Reset filters</button>
      </div>
    </section>

    <section>
      <h2 class="section-title">Shops</h2>
      <div class="shop-grid" id="shopGrid"></div>
    </section>

    <section>
      <h2 class="section-title">Products</h2>
      <div class="product-grid" id="productGrid">
        <p class="empty">Loading products…</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/js/app.js"></script>
  <script src="/js/browse.js"></script>
</body>
</html>
