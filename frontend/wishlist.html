<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My wishlist · Grocery Availability</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Grocery<span>Availability</span></a>
    <nav>
      <a href="/">Browse</a>
      <a href="/wishlist.html" id="wishlistLink" hidden>Wishlist</a>
      <a href="/shop.html" id="shopLink" hidden>My Shop</a>
      <a href="/login.html" id="loginLink">Sign in</a>
      <button class="btn btn-outline btn-small" id="logoutBtn" hidden>Sign out</button>
    </nav>
  </header>

  <main class="dashboard">
    <div class="dashboard-head">
      <div>
        <p class="eyebrow">SAVED ITEMS</p>
        <h1>My wishlist</h1>
        <p id="wishlistSummary">Loading your wishlist…</p>
      </div>
      <a class="btn btn-outline" href="/">Keep browsing</a>
    </div>

    <div id="wishlistList"></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/js/app.js"></script>
  <script src="/js/wishlist.js"></script>
</body>
</html>
